<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>G4 Advanced M11/M12 單字</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#16302a;--mute:#5d746c;--ac:#2f7d4f;--ac2:#d8ecdf;--line:#cfdcd5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans TC",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:12px 16px}
h1{margin:0 0 8px;font-size:1.15rem}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar label,.bar select,.bar input[type=search]{font-size:.9rem}
.seg{display:inline-flex;border:1px solid #6f9a86;border-radius:8px;overflow:hidden}
.seg button{background:transparent;color:#fff;border:0;padding:6px 12px;cursor:pointer;font-size:.9rem}
.seg button[aria-pressed=true]{background:var(--ac);font-weight:700}
.tg{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
select,input[type=search]{padding:6px 8px;border-radius:8px;border:1px solid #6f9a86;background:#fff;color:var(--ink)}
main{max-width:1000px;margin:0 auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ac);border-radius:6px;padding:10px 12px;display:block}
.card:hover{background:var(--ac2)}
.card:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.card.on{background:var(--ac2);border-color:var(--ac)}
.n{float:right;color:var(--mute);font-size:.75rem}
.w{font-size:1.35rem;font-weight:700}
.p{color:var(--mute);font-size:.8rem;margin-left:4px;font-weight:400}
.k{color:var(--ac);font-size:.95rem;min-height:1.4em;font-family:"Noto Sans","Segoe UI",sans-serif}
.z{font-size:1rem;margin-top:2px}
body.nokk .k{display:none}body.nozh .z{display:none}
#msg{max-width:1000px;margin:0 auto;padding:0 16px;color:var(--mute);font-size:.85rem}
.cw{position:relative;display:flex}
.cw .card{flex:1;min-width:0;min-height:112px;overflow-wrap:anywhere}
.ck{position:absolute;right:6px;bottom:6px;padding:6px;cursor:pointer;line-height:0}
.ck input{width:20px;height:20px;accent-color:var(--ac);cursor:pointer}
.cw .card{padding-bottom:12px}
.ex{background:#fff;color:var(--ink);border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.9rem}
.ex.go{background:var(--ac);color:#fff;font-weight:700}
#pv{display:none}
@media print{header,main,#msg{display:none!important}body{background:#fff}#pv{display:block;padding:0}
#pv h2{font-size:16pt;margin:0 0 4pt}#pv p{margin:0 0 8pt;color:#555;font-size:9pt}
#pv table{width:100%;border-collapse:collapse;font-size:11pt}
#pv th,#pv td{border:1px solid #999;padding:4pt 6pt;text-align:left}
#pv th{background:#d8ecdf}#pv tr{break-inside:avoid}#pv .kk{font-family:"Noto Sans","Segoe UI",sans-serif}
@page{margin:14mm}}
</style></head><body class="nozh">
<header><h1>G4 Advanced M11/M12 單字（點一下聽發音）</h1>
<div class="bar">

<label class="tg"><input type="checkbox" id="zh"> 中文</label>
<label class="tg"><input type="checkbox" id="kk" checked> KK音標</label>
<label>語速 <select id="sp"><option value=".6">慢</option><option value=".85" selected>正常</option><option value="1">快</option></select></label>
<select id="rg" aria-label="範圍"></select>
<input type="search" id="q" placeholder="搜尋單字或中文">
<button class="ex" id="sa">全選目前範圍</button><button class="ex" id="sc">清除選取</button>
<label class="tg"><input type="checkbox" id="pz" checked> PDF含中文</label>
<button class="ex go" id="pd">匯出PDF（0）</button>
</div></header>
<div id="msg"></div>
<main id="list"></main>
<div id="pv"></div>

modern|現代的|adj|ˈmɑdɚn
hollow|中空的|adj|ˈhɑlo
metal|金屬|n|ˈmɛtl
instead of|而不是|phr|ɪnˈstɛd əv
future|未來|n|ˈfjutʃɚ

type|類型|n|taɪp
electric|電動的|adj|ɪˈlɛktrɪk

express|表達|v|ɪkˈsprɛs
certainty|確實|n|ˈsɝtntɪ

const W=RAW.split("\n").map((l,i)=>{const a=l.split("|");return{n:i+1,w:a[0],z:a[1],p:a[2],k:a[3]}});
const $=id=>document.getElementById(id),L=$("list");
let seq=0,acc="en-US",cur=null,shown=[];const sel=new Set();
const cnt=()=>$("pd").textContent="匯出PDF（"+sel.size+"）";
const rg=$("rg");rg.innerHTML='<option value="0">全部 1–200</option>'+[0,1,2,3].map(i=>`<option value="${i*50+1}">${i*50+1}–${i*50+50}</option>`).join("");
function render(){
 const s=rg.value*1,q=$("q").value.trim().toLowerCase();
 const d=W.filter(x=>(!s||(x.n>=s&&x.n<s+50))&&(!q||x.w.includes(q)||x.z.includes(q)));
 shown=d;
 L.innerHTML=d.map(x=>`<div class="cw"><button class="card" data-w="${x.w}"><span class="n">${x.n}</span><div class="w">${x.w}<span class="p">${x.p}.</span></div><div class="k">/${x.k}/</div><div class="z">${x.z}</div></button><label class="ck" title="加入PDF"><input type="checkbox" data-n="${x.n}" aria-label="選取 ${x.w}"${sel.has(x.n)?" checked":""}></label></div>`).join("")||"<p>找不到符合的單字</p>";
 cnt();
}
function cands(){
 const m=x=>x.lang.replace("_","-")===acc,v=speechSynthesis.getVoices().filter(m);
 return [...v.filter(x=>x.localService),...v.filter(x=>!x.localService),null];
}
let U=null;
function say(t,el,k=0,tk=++seq){
 if(!("speechSynthesis" in window)){$("msg").textContent="這個瀏覽器不支援語音朗讀，請改用 Chrome、Safari 或 Edge（不要在 LINE、FB 內建瀏覽器開）。";return}
 const ss=speechSynthesis;ss.cancel();ss.resume();
 if(cur&&cur!==el)cur.classList.remove("on");cur=el;el.classList.add("on");
 setTimeout(()=>{
  if(tk!==seq)return;
  const c=cands(),v=c[Math.min(k,c.length-1)],u=new SpeechSynthesisUtterance(t);U=u;
  u.lang=acc;if(v)u.voice=v;u.rate=+$("sp").value;u.volume=1;
  u.onend=()=>{if(tk===seq)el.classList.remove("on")};
  u.onerror=e=>{
   if(e.error==="canceled"||e.error==="interrupted"||tk!==seq)return;
   if(k<c.length-1){say(t,el,k+1,tk);return}
   el.classList.remove("on");$("msg").textContent="語音播放失敗（"+e.error+"）。請確認音量未靜音，並到系統設定安裝英文語音。";
  };
  ss.speak(u);
  $("msg").textContent=v?"":"找不到"+(acc=="en-US"?"美式":"英式")+"語音，改用裝置預設語音。";
 },60);
}
L.addEventListener("click",e=>{const c=e.target.closest(".card");if(!c)return;say(c.dataset.w,c)});
[["us","en-US"],["uk","en-GB"]].forEach(([id,l])=>$(id).onclick=()=>{acc=l;$("us").setAttribute("aria-pressed",l=="en-US");$("uk").setAttribute("aria-pressed",l=="en-GB")});
$("zh").onchange=e=>document.body.classList.toggle("nozh",!e.target.checked);
$("kk").onchange=e=>document.body.classList.toggle("nokk",!e.target.checked);
L.addEventListener("change",e=>{const n=+e.target.dataset.n;if(!n)return;e.target.checked?sel.add(n):sel.delete(n);cnt()});
$("sa").onclick=()=>{shown.forEach(x=>sel.add(x.n));render()};
$("sc").onclick=()=>{sel.clear();render()};
$("pd").onclick=()=>{
 if(!sel.size){$("msg").textContent="請先勾選要匯出的單字，或按「全選目前範圍」。";return}
 const z=$("pz").checked,d=W.filter(x=>sel.has(x.n));
 $("pv").innerHTML=`<h2>G4 Advanced M11/M12 單字複習</h2><p>共 ${d.length} 字</p><table><tr><th>#</th><th>Word</th><th>KK</th><th>詞性</th>${z?"<th>中文</th>":""}</tr>${d.map(x=>`<tr><td>${x.n}</td><td><b>${x.w}</b></td><td class="kk">/${x.k}/</td><td>${x.p}.</td>${z?`<td>${x.z}</td>`:""}</tr>`).join("")}</table>`;
 $("msg").textContent="在列印視窗中，將目的地選為「另存為 PDF」。";
 window.print();
};
rg.onchange=render;$("q").oninput=render;
if("speechSynthesis" in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}
render();
</script></body></html>
